[config]
schemaVersion = "0.0.1"

[package]
namespace = "SpecialCircumstances"
name = "InscryptionWarning"
versionNumber = "0.1.0"
description = "Highlights on the map which branch matches the Inscryption event's secret code, so the code is actually usable. Configurable cue, from a barely-there tint to an unmissable marker."
websiteUrl = "https://github.com/Amaury-Lepicard/MT2-InscryptionWarning"
containsNsfwContent = false

[package.dependencies]
BepInEx-BepInExPack = "5.4.2100"
MT2-Trainworks_Reloaded = "0.7.2"
Conductor-Conductor = "0.4.1"

[build]
icon = "./icon.png"
readme = "./README.md"
outdir = "./"

[[build.copy]]
source = "./plugin_build"
target = ""

[publish]
repository = "https://thunderstore.io"
communities = [ "monster-train-2" ]
